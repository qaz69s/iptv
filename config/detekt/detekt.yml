build:
  maxIssues: 0
complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10
    ignoreDefaultParameters: true
  LongMethod:
    threshold: 150
  CyclomaticComplexMethod:
    threshold: 25
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    active: false
  ComplexCondition:
    threshold: 6
  NestedBlockDepth:
    threshold: 6
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 160
  ReturnCount:
    max: 5
  WildcardImport:
    active: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    active: true
    comments: ['TODO:', 'FIXME:', 'STOPSHIP:']
  MaxChainedCallsOnSameLine:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
