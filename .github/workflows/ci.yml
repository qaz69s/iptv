name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --continue

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Print Room schemas that are not committed
        if: always()
        run: |
          git status --porcelain core/database/schemas
          for f in $(git ls-files --others --exclude-standard core/database/schemas); do echo "=== $f"; cat "$f"; done

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Print lint report
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Assemble debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streambox-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
